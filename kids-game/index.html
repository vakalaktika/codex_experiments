<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleepy Friends</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Layout: a cut-paper diorama. Scene on the left, the child's real controller
     drawn on the right, so every press in the hand has a twin on the screen. */
  :root {
    color-scheme: light;
    --sky: #bfe4f0; --paper: #fffaf0; --card: #f6efe0; --ink: #3d3552; --ink-soft: #8a829c;
    --shadow: rgba(61, 53, 82, .22);
    --green: #63c886; --red: #f0766c; --blue: #5aa6ec; --yellow: #f6c445; --wrong: #e5484d;
    --font-display: 'Fredoka', 'Baloo 2', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-utility: system-ui, -apple-system, 'Segoe UI', sans-serif;

    /* transitions.dev motion tokens */
    --duration-stagger: 40ms; --duration-micro: 80ms; --duration-quick: 150ms; --duration-fast: 250ms;
    --duration-medium: 350ms; --duration-slow: 400ms; --duration-very-slow: 500ms;
    --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1); --ease-in-out: ease-in-out; --ease-out: ease-out;
    --ease-linear: linear; --ease-bounce: cubic-bezier(0.34, 1.36, 0.64, 1);
    --distance-micro: 4px; --distance-small: 6px; --distance-base: 8px; --distance-medium: 12px; --distance-large: 30px;
    --scale-large: 0.96; --blur-small: 2px; --blur-medium: 3px; --blur-large: 8px;
    /* per-transition variables (modal, texts reveal, number pop-in, error shake, success check) */
    --modal-open-dur: var(--duration-fast); --modal-close-dur: var(--duration-quick);
    --modal-scale: var(--scale-large); --modal-scale-close: var(--scale-large); --modal-ease: var(--ease-smooth-out);
    --stagger-dur: var(--duration-very-slow); --stagger-distance: var(--distance-medium);
    --stagger-stagger: var(--duration-micro); --stagger-blur: var(--blur-medium); --stagger-ease: var(--ease-smooth-out);
    --digit-dur: var(--duration-very-slow); --digit-distance: var(--distance-base); --digit-blur: var(--blur-small);
    --digit-ease: cubic-bezier(0.34, 1.45, 0.64, 1); --digit-dir-x: 0; --digit-dir-y: 1;
    --shake-distance: var(--distance-small); --shake-overshoot: var(--distance-micro);
    --shake-dur-a: 80ms; --shake-dur-b: 60ms; --shake-ease: var(--ease-smooth-out);
    --check-opacity-dur: 500ms; --check-rotate-dur: 500ms; --check-rotate-from: 80deg; --check-bob-dur: 500ms;
    --check-y-amount: var(--distance-large);
    --check-ease-out: var(--ease-smooth-out); --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
  }
  html, body { margin: 0; height: 100%; background: var(--sky); overflow: hidden; }
  body { font-family: var(--font-display); color: var(--ink); }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: size; background: var(--sky); user-select: none; }

  /* ---------- paper world ---------- */
  .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; mix-blend-mode: multiply; }
  .sun { position: absolute; left: 86cqw; top: 5cqh; width: 11cqmin; aspect-ratio: 1; border-radius: 50%;
    background: #fbdc7a; border: .9cqmin solid #fff; box-shadow: 0 .8cqmin 0 var(--shadow); }
  .cloud { position: absolute; height: 6cqmin; width: 20cqmin; border-radius: 6cqmin; background: #fff;
    box-shadow: 0 .7cqmin 0 var(--shadow); animation: drift 40s var(--ease-in-out) infinite alternate; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 9cqmin; height: 9cqmin; left: 3cqmin; top: -4.5cqmin; }
  .cloud::after { width: 7cqmin; height: 7cqmin; left: 10cqmin; top: -3cqmin; }
  .cloud { transition: opacity var(--duration-fast) var(--ease-smooth-out); }
  .cloud.c1 { left: 8cqw; top: 12cqh; } .cloud.c2 { left: 64cqw; top: 6cqh; transform: scale(.7); animation-duration: 55s; }
  #app:is([data-screen="play"], [data-screen="done"], [data-screen="count"], [data-screen="paint"]) .cloud.c1 { opacity: 0; }
  @keyframes drift { to { translate: 5cqw 0; } }
  .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 46%; }
  .hills path { stroke: #fff; stroke-width: 5; vector-effect: non-scaling-stroke; paint-order: stroke; filter: drop-shadow(0 -3px 0 var(--shadow)); }

  .sticker { display: inline-block; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    filter: drop-shadow(.04em 0 0 #fff) drop-shadow(-.04em 0 0 #fff) drop-shadow(0 .04em 0 #fff) drop-shadow(0 -.04em 0 #fff) drop-shadow(0 .06em 0 var(--shadow)); }
  .key { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%;
    background: var(--kc, var(--paper)); color: var(--ink); font-weight: 700; border: .14em solid #fff;
    box-shadow: 0 .14em 0 var(--shadow); line-height: 1; }
  .key.ka { --kc: var(--green); } .key.kb { --kc: var(--red); } .key.kx { --kc: var(--blue); } .key.ky { --kc: var(--yellow); }
  .papercard { background: var(--paper); border: .9cqmin solid #fff; border-radius: 5cqmin;
    box-shadow: 0 1.2cqmin 0 var(--shadow); }

  /* ---------- screens: one soft cross-fade, like a page slide ---------- */
  .screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transform: translateY(var(--distance-base));
    filter: blur(var(--blur-medium));
    transition: opacity var(--duration-fast) var(--ease-smooth-out), transform var(--duration-fast) var(--ease-smooth-out),
      filter var(--duration-fast) var(--ease-smooth-out), visibility 0s linear var(--duration-fast); }
  #app[data-screen="title"] #title, #app[data-screen="help"] #title,
  #app[data-screen="play"] #play, #app[data-screen="done"] #play, #app[data-screen="count"] #play, #app[data-screen="paint"] #play,
  #app[data-screen="finale"] #finale {
    opacity: 1; visibility: visible; transform: none; filter: none;
    transition: opacity var(--duration-fast) var(--ease-smooth-out), transform var(--duration-fast) var(--ease-smooth-out),
      filter var(--duration-fast) var(--ease-smooth-out), visibility 0s; }

  /* ---------- title ---------- */
  #title { display: flex; flex-direction: column; align-items: center; padding-top: 3cqh; gap: 0; }
  .logo { margin: 0; font-size: 11cqmin; font-weight: 700; line-height: .95; text-align: center; letter-spacing: .01em; text-wrap: balance; }
  .logo i { display: inline-block; font-style: normal; color: var(--lc); rotate: var(--r, 0deg);
    -webkit-text-stroke: .16em #fff; paint-order: stroke fill; text-shadow: 0 .07em 0 var(--shadow); }
  .title-friends { display: flex; gap: 3cqmin; font-size: 7.5cqmin; }
  .title-friends .sticker { animation: breathe 3.6s var(--ease-in-out) infinite; }
  .title-friends .sticker:nth-child(2n) { animation-delay: -1.8s; }
  @keyframes breathe { 50% { transform: scale(1.05) rotate(-2deg); } }
  #title > * { transition: opacity var(--duration-fast) var(--ease-smooth-out); }
  #app[data-screen="help"] #title > * { opacity: .25; }

  #notices { position: absolute; left: 3cqw; top: 36cqh; width: 25cqw; display: grid; gap: 2cqmin; }
  #notices .papercard { padding: 2cqmin 2.4cqmin; border-radius: 3cqmin; font: 600 2.7cqmin/1.35 var(--font-utility); color: var(--ink); text-align: left; }
  #needsound { background: var(--yellow); cursor: pointer; }
  #needsound:focus-visible { outline: .6cqmin solid var(--ink); outline-offset: .4cqmin; }
  #notices [hidden] { display: none; }
  @container (aspect-ratio < 1.15) { #notices { top: 22cqh; left: 4cqw; width: 92cqw; } }

  /* texts reveal (transitions.dev 18) */
  .t-stagger-line { display: block; opacity: 0; transform: translateY(var(--stagger-distance)); filter: blur(var(--stagger-blur));
    transition: opacity var(--stagger-dur) var(--stagger-ease), transform var(--stagger-dur) var(--stagger-ease), filter var(--stagger-dur) var(--stagger-ease);
    will-change: transform, opacity, filter; }
  .t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
  .t-stagger.is-shown .t-stagger-line { opacity: 1; transform: translateY(0); filter: blur(0); }

  /* modal open / close (transitions.dev 06) */
  .t-modal { transform-origin: center; transform: scale(var(--modal-scale)); opacity: 0; pointer-events: none;
    transition: transform var(--modal-open-dur) var(--modal-ease), opacity var(--modal-open-dur) var(--modal-ease);
    will-change: transform, opacity; }
  .t-modal.is-open { transform: scale(1); opacity: 1; pointer-events: auto; }
  .t-modal.is-closing { transform: scale(var(--modal-scale-close)); opacity: 0; pointer-events: none;
    transition: transform var(--modal-close-dur) var(--modal-ease), opacity var(--modal-close-dur) var(--modal-ease); }

  /* ---------- the controller ---------- */
  #pad { position: absolute; left: 50%; top: 50%; width: min(46cqw, 82cqh); z-index: 20; opacity: 1;
    --px: 0cqw; --py: 21cqh; --ps: .88;
    transform: translate(-50%, -50%) translate(var(--px), var(--py)) scale(var(--ps));
    transition: transform var(--duration-very-slow) var(--ease-smooth-out), opacity var(--duration-fast) var(--ease-smooth-out); }
  #app:is([data-screen="play"], [data-screen="done"], [data-screen="count"], [data-screen="paint"], [data-screen="help"], [data-screen="settings"]) #pad { --px: 28cqw; --py: 6cqh; --ps: .8; }
  #app[data-screen="finale"] #pad { --px: 34cqw; --py: 28cqh; --ps: .5; }
  #padsvg { display: block; width: 100%; overflow: visible; filter: drop-shadow(0 1.2cqmin 0 var(--shadow)); }
  #pad.is-shaking { animation: t-input-shake calc(var(--shake-dur-a) * 2 + var(--shake-dur-b) * 2) linear; }
  @keyframes t-input-shake {
    0%     { translate: 0; animation-timing-function: var(--shake-ease); }
    28.57% { translate: var(--shake-distance); animation-timing-function: var(--shake-ease); }
    57.14% { translate: calc(var(--shake-distance) * -1); animation-timing-function: var(--shake-ease); }
    78.57% { translate: var(--shake-overshoot); animation-timing-function: var(--shake-ease); }
    100%   { translate: 0; }
  }
  /* touch screens: the picture of the controller is the controller */
  #pad { touch-action: none; -webkit-tap-highlight-color: transparent; }
  #padsvg .hit { fill: transparent; stroke: none; pointer-events: all; }
  .screen { pointer-events: none; } #notices { pointer-events: auto; }
  #app[data-touch] #pad { width: min(56cqw, 115cqh); --py: 16cqh; --ps: .82; cursor: pointer; }
  #app[data-touch]:is([data-screen="play"], [data-screen="done"], [data-screen="count"], [data-screen="paint"], [data-screen="help"], [data-screen="settings"]) #pad { --px: 23cqw; --py: 4cqh; --ps: 1; }
  #app[data-touch][data-screen="finale"] #pad { --px: 26cqw; --py: 20cqh; --ps: .8; }
  #app[data-touch] :is(#topbar, #scene, .overlay) { left: 1.5cqw; width: 43cqw; }
  #app[data-touch] #k-ls.can .halo { opacity: 0; animation: none; }
  @container (aspect-ratio < 1.15) {
    #app[data-touch] #pad { width: 98cqw; --py: 18cqh; --ps: 1; }
    #app[data-touch]:is([data-screen="play"], [data-screen="done"], [data-screen="count"], [data-screen="paint"], [data-screen="help"], [data-screen="settings"]) #pad { --px: 0cqw; --py: 27cqh; --ps: 1; }
    #app[data-touch][data-screen="finale"] #pad { --px: 0cqw; --py: 30cqh; --ps: .9; }
    #app[data-touch] :is(#topbar, #scene, .overlay) { left: 4cqw; width: 92cqw; }
    #app[data-touch] :is(#scene, .overlay) { bottom: 47cqh; }
  }
  /* editions of the 8BitDo Ultimate 3C+ */
  #pad { --c-body: #f0efed; --c-edge: #d9d7d3; --c-btn: #b5b3b0; --c-btn-edge: #9b9996; --c-letter: #f6f5f3;
    --c-ring: #cfcdc9; --c-well: #dedcd8; --c-bump: #c9c7c3; --c-mark: #8f8d89; --c-small: #e3e2df; --c-small-edge: #cfcdc9; }
  #pad[data-edition="black"] { --c-body: #2c2c30; --c-edge: #1b1b1e; --c-btn: #1d1d20; --c-btn-edge: #0f0f11; --c-letter: #e9e9ec;
    --c-ring: #8b8b90; --c-well: #232326; --c-bump: #d0d0d2; --c-mark: #a0a0a6; --c-small: #1f1f22; --c-small-edge: #101012; }
  #pad[data-edition="green"] { --c-body: #5d7440; --c-edge: #495d31; --c-btn: #b9d35a; --c-btn-edge: #98b545; --c-letter: #4f6a2c;
    --c-ring: #6e4428; --c-well: #536839; --c-bump: #7d4526; --c-mark: #a9c46a; --c-small: #556b3a; --c-small-edge: #465a2f; }
  #pad[data-edition="xbox"] { --c-body: #f3f3f1; --c-edge: #d2d2ce; --c-btn: #232326; --c-btn-edge: #0e0e10; --c-letter: #fff;
    --c-ring: #c9c9c5; --c-well: #e2e2de; --c-bump: #dcdcd8; --c-mark: #77777c; --c-small: #2b2b2f; --c-small-edge: #111114; }
  #pad[data-edition="xbox"] #k-a text.lt { fill: #7ed957; } #pad[data-edition="xbox"] #k-b text.lt { fill: #ff6b5e; }
  #pad[data-edition="xbox"] #k-x text.lt { fill: #5fb0ff; } #pad[data-edition="xbox"] #k-y text.lt { fill: #ffd24a; }
  #pad[data-edition="xbox"] :is(#k-minus, #k-plus) .mark, #pad[data-edition="switch"] .small.press ~ .mark { stroke: #e9e9ec; }
  #pad[data-edition="ps"] { --c-body: #f4f5f7; --c-edge: #cfd3da; --c-btn: #fbfbfc; --c-btn-edge: #c3c8d0; --c-letter: #6f7682;
    --c-ring: #2a2c31; --c-well: #e3e6eb; --c-bump: #e9ebef; --c-mark: #8c93a0; --c-small: #fbfbfc; --c-small-edge: #c3c8d0; --c-stick: #232428; --c-stick-edge: #0f1012; }
  #pad[data-edition="switch"] { --c-body: #3a3d42; --c-edge: #26282c; --c-btn: #25272a; --c-btn-edge: #121315; --c-letter: #e6e7ea;
    --c-ring: #54575d; --c-well: #2e3035; --c-bump: #2b2d31; --c-mark: #a8abb2; --c-small: #25272a; --c-small-edge: #121315; }
  #padsvg .stick .cap { fill: var(--c-stick, var(--c-btn)); stroke: var(--c-stick-edge, var(--c-btn-edge)); }
  #pad[data-edition="ps"] :is(.arm .cap, .face .cap) { stroke: #9aa1ad; }
  #padsvg .touch { fill: #1d1e22; stroke: var(--c-edge); stroke-width: 1.5; }
  #pad:not([data-brand="8bitdo"]) .only-8bitdo, #pad:not([data-brand="ps"]) .only-ps, #pad:not([data-brand="8bitdo"]) .led { display: none; }
  #pad:not([data-brand="xbox"]) .only-xbox, #pad:not([data-brand="switch"]) .only-switch,
  #pad:is([data-brand="xbox"], [data-brand="ps"]) .m-pm, #pad:not(:is([data-brand="xbox"], [data-brand="ps"])) .m-menu,
  #pad:not([data-brand="8bitdo"]) .grip { display: none; }
  #padsvg .console { fill: #1d1e22; }
  #pad[data-brand="xbox"] #k-home .cap { fill: #fff; stroke: #b9b9b5; } #pad[data-brand="xbox"] #k-home .mark { stroke: #55555a; }
  #pad[data-brand="xbox"] #k-home { scale: 1.25; transform-box: fill-box; transform-origin: center; }
  #padsvg .body { fill: var(--c-body); stroke: var(--c-edge); stroke-width: 2.5; }
  #padsvg .grip { fill: var(--c-edge); opacity: .35; }
  #padsvg .bump path, #padsvg .trig rect { fill: var(--c-bump); stroke: var(--c-edge); stroke-width: 1.5; }
  #padsvg .well { fill: var(--c-well); }
  #padsvg .ring { fill: var(--c-ring); stroke: var(--c-edge); stroke-width: 1; }
  #padsvg .cap { fill: var(--c-btn); stroke: var(--c-btn-edge); stroke-width: 1.5; }
  #padsvg .dimple { fill: var(--c-btn-edge); opacity: .45; }
  #padsvg .bump.can path, #padsvg .trig.can rect { fill: var(--yellow); stroke: var(--ink); stroke-width: 3; animation: bumpglow 1.8s var(--ease-in-out) infinite; }
  @keyframes bumpglow { 50% { fill-opacity: .55; } }
  #padsvg .co circle.prog { fill: none; stroke: var(--green); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120;
    transform-box: fill-box; transform-origin: center; transform: rotate(-90deg); filter: none; }
  #padsvg .cap.small { fill: var(--c-small); stroke: var(--c-small-edge); }
  #padsvg .arm .mark { stroke: var(--c-btn-edge); }
  #padsvg text.lt { fill: var(--c-letter); font: 700 15px var(--font-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  #padsvg .mark { fill: none; stroke: var(--c-mark); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #padsvg .led { fill: #fff; stroke: #9be7ff; stroke-width: 2; }
  #padsvg .k .press { transform-box: fill-box; transform-origin: center;
    transition: transform var(--duration-micro) var(--ease-out), filter var(--duration-micro) var(--ease-out); }
  #padsvg .k.down .press { transform: translateY(1.5px) scale(.9); filter: brightness(.8); }
  #padsvg .halo { fill: none; stroke: var(--hc, #fff); stroke-width: 6.5; opacity: 0;
    filter: drop-shadow(1.3px 0 0 var(--he, #fff)) drop-shadow(-1.3px 0 0 var(--he, #fff)) drop-shadow(0 1.3px 0 var(--he, #fff)) drop-shadow(0 -1.3px 0 var(--he, #fff));
    transform-box: fill-box; transform-origin: center; transition: opacity var(--duration-fast) var(--ease-smooth-out); }
  #padsvg .k.can .halo { opacity: 1; animation: halo 1.8s var(--ease-in-out) infinite; }
  #padsvg .k.can:is(.hint, .ask) .halo { animation-duration: .9s; stroke-width: 9; }
  @keyframes halo { 50% { transform: scale(1.12); opacity: .75; } }
  #k-a { --hc: var(--green); } #k-b { --hc: var(--red); } #k-x { --hc: var(--blue); } #k-y { --hc: var(--yellow); }
  #k-plus, #k-minus, #k-ls, #k-du, #k-dd, #k-dl, #k-dr { --hc: #fff; --he: var(--ink); }
  #padsvg .co { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.6);
    transition: opacity var(--duration-quick) var(--ease-smooth-out), transform var(--duration-quick) var(--ease-smooth-out); }
  #padsvg .co.is-on { opacity: 1; transform: scale(1);
    transition: opacity var(--duration-very-slow) var(--ease-bounce), transform var(--duration-very-slow) var(--ease-bounce); }
  #padsvg .co line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 7; }
  #padsvg .co circle { fill: var(--paper); stroke: #fff; stroke-width: 4; filter: drop-shadow(0 3px 0 var(--shadow)); }
  #padsvg .co text { font: 700 22px var(--font-display); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  #nope { opacity: 0; pointer-events: none; }
  #nope.is-on { animation: nope 800ms var(--ease-linear) both; }
  #nope path { fill: none; stroke-linecap: round; }
  @keyframes nope {
    0% { opacity: 0; scale: .4; animation-timing-function: var(--ease-bounce); }
    30% { opacity: 1; scale: 1; }
    70% { opacity: 1; scale: 1; animation-timing-function: var(--ease-smooth-out); }
    100% { opacity: 0; scale: .9; }
  }

  /* ---------- play ---------- */
  #topbar { position: absolute; left: 3cqw; top: 3cqh; width: 54cqw; height: 9cqh; display: flex; align-items: center; justify-content: space-between; }
  #levels { display: flex; gap: 1.1cqmin; align-items: center; padding: .7cqmin 1.6cqmin; border-radius: 99px; background: var(--paper);
    border: .6cqmin solid #fff; box-shadow: 0 .6cqmin 0 var(--shadow); font-size: 5.2cqmin; }
  #levels b { position: relative; width: 2.6cqmin; height: 2.6cqmin; border-radius: 50%; background: var(--ink); opacity: .22;
    transition: opacity var(--duration-fast) var(--ease-smooth-out), background-color var(--duration-fast) var(--ease-smooth-out); }
  #levels b.is-done { background: var(--green); opacity: 1; }
  #levels b.is-now { background: none; opacity: 1; width: 6.4cqmin; }
  #levels b.is-now::after { content: "🚚"; position: absolute; left: 50%; top: 50%; translate: -50% -50%; scale: -1 1; font-size: 5.6cqmin; line-height: 1;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  #levels .cup { font-size: 4.6cqmin; margin-left: .4cqmin; }
  #stars { display: flex; gap: .9cqmin; font-size: 5.2cqmin; padding: .7cqmin 1.8cqmin; border-radius: 99px; background: var(--paper);
    border: .6cqmin solid #fff; box-shadow: 0 .6cqmin 0 var(--shadow); }
  #stars .sticker { opacity: .3; filter: grayscale(1); }
  #stars .sticker.on { opacity: 1; filter: drop-shadow(.04em 0 0 #fff) drop-shadow(-.04em 0 0 #fff) drop-shadow(0 .04em 0 #fff) drop-shadow(0 -.04em 0 #fff) drop-shadow(0 .06em 0 var(--shadow));
    animation: t-check-fade var(--check-opacity-dur) var(--check-ease-out) both, t-check-rotate var(--check-rotate-dur) var(--check-ease-out) both,
      t-check-bob var(--check-bob-dur) var(--check-ease-bob) both; }
  #app[data-screen="paint"] #stars, #app[data-screen="paint"] #levels { visibility: hidden; }

<script>

const FRIEND = {

  c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(P.tmp, 0, 0);
  c.setTransform(P.dpr, 0, 0, P.dpr, 0, 0); c.strokeStyle = '#3d3552'; c.lineJoin = c.lineCap = 'round';
  c.lineWidth = Math.max(4, P.brush * .16); P.parts.forEach(p => c.stroke(p));
  c.lineWidth = Math.max(3, P.brush * .11); P.details.forEach(p => c.stroke(p));
}

// ---------- grown-up settings: hold − and + together (or press G) ----------
const cyc = (list, cur, d) => list[(list.indexOf(cur) + d + list.length) % list.length];
function setSkin(v) { G.skin = v; if (BRAND[v] === undefined && v !== 'auto') G.edition = v; applySkin(); save(); }
const WIZ_STEPS = ['y', 'x', 'b', 'a', 'lb', 'rb', 'minus', 'plus'];
const SETROWS = [
  { label: 'Controller picture', val: () => G.skin === 'auto' ? `Auto: ${padId ? (detectBrand(padId) ? 'found ' : 'not recognised, showing ') + SKIN_NAME[skinNow()] : 'no controller yet'}` : SKIN_NAME[G.skin],
    step: d => setSkin(cyc(SKINS, G.skin, d)) },
  { label: 'Touch-screen buttons', val: () => ({ auto: `Auto (${touchOn() ? 'on' : 'off'})`, on: 'On', off: 'Off' })[G.touchPref], step: d => { G.touchPref = cyc(['auto', 'on', 'off'], G.touchPref, d); } },
  { label: 'Stars to finish a level', val: () => G.starGoal, step: d => { G.starGoal = cyc([3, 4, 5], G.starGoal, d); } },
  { label: 'Pointing hints appear', val: () => ({ .5: 'Quickly', 1: 'After a moment', 2: 'Slowly' })[G.hintMul], step: d => { G.hintMul = cyc([.5, 1, 2], G.hintMul, d); } },
  { label: 'Volume', val: () => Math.round(G.volume * 10) || 'Off', step: d => { G.volume = Math.max(0, Math.min(1, (Math.round(G.volume * 10) + d) / 10)); setVolume(); play('pop'); } },
  { label: 'Rumble', val: () => G.rumble ? 'On' : 'Off', step: () => { G.rumble = !G.rumble; rumble(); } },
  { label: 'Friends hide from button mashing', val: () => G.shy ? 'On' : 'Off', step: () => { G.shy = !G.shy; } },
  { label: 'Button numbering', val: () => ({ auto: `Auto (${layoutShown})`, standard: 'Standard', alternate: 'Alternate' })[layoutChoice], step: d => { layoutChoice = cyc(['auto', 'standard', 'alternate'], layoutChoice, d); } },
  { label: 'Teach the game my buttons', val: () => G.custom ? 'Learned ▶' : 'Start ▶', act: () => { G.wiz = { i: 0, steps: WIZ_STEPS, got: {}, readyAt: now() + 400 }; } },
  { label: 'Forget learned buttons', val: () => G.custom ? '▶' : 'Nothing learned', act: () => { G.custom = null; } },
  { label: 'Lock paint again', val: () => !G.paintUnlocked ? 'Locked' : G.confirm ? 'Press again to lock' : 'Unlocked ▶', act: () => { if (G.confirm) { G.paintUnlocked = false; G.confirm = false; } else if (G.paintUnlocked) G.confirm = true; } },
  { label: 'Keyboard keys', val: () => G.showKeys ? 'Shown below' : 'Show ▶', act: () => { G.showKeys = !G.showKeys; } },
  { label: 'Close', val: () => '▶', act: () => closeSettings() },
];
function renderSettings() {
  if (G.screen !== 'settings') return;
  const w = G.wiz;
  $('#setrows').innerHTML = w
    ? `<div class="wiz"><span>Press this button on the controller</span><span class="key">${lab(w.steps[w.i])}</span><span>${w.i + 1} of ${w.steps.length}</span></div>`
    : SETROWS.map((r, i) => `<div class="setrow${i === G.setRow ? ' sel' : ''}"><span>${r.label}</span><span class="val">${r.step ? '◀ ' : ''}${r.val()}${r.step ? ' ▶' : ''}</span></div>`).join('');
  $('#sethelp').textContent = w ? 'The button to press is also lit on the picture. Esc on the keyboard cancels.'
    : G.showKeys ? 'Keyboard: Esc title · 1–9 and 0 jump to a level · P paint · N new picture · M mute · W A S D are the four buttons · arrows are the D-pad · Q E the bumpers · Enter and Backspace the two small buttons'
    : `D-pad chooses and changes · ${lab('a')} selects · ${lab('b')} closes · hold ${lab('minus')} and ${lab('plus')} to open this screen\nController: ${padId || 'none connected'} · last button #${lastRaw}`;
}
function openSettings() { leave(); G.setRow = 0; G.confirm = false; setScreen('settings'); openModal($('#settings')); renderSettings(); play('open'); }
function closeSettings() { save(); play('close'); goTitle(); }
function settingsPress(n) {
  const r = SETROWS[G.setRow];
  if (n === 'b') return closeSettings();
  if (n === 'du' || n === 'dd') { G.setRow = (G.setRow + (n === 'dd' ? 1 : -1) + SETROWS.length) % SETROWS.length; G.confirm = false; play('step'); }
  else if (r.step) { r.step(n === 'dl' ? -1 : 1); play('pop'); }
  else if (n === 'a') { r.act(); play('pop'); }
  if (G.screen !== 'settings') return;
  save(); buildStars(); refreshPad(); renderSettings();
}
// teaching: each button the picture asks for is matched to whatever number the real controller sends
function wizFrame(cur) {
  const w = G.wiz; if (now() < w.readyAt || !cur._new.length) return;
  w.got[w.steps[w.i]] = cur._new[0]; w.i++; w.readyAt = now() + 350; play('pop');
  if (w.i >= w.steps.length) { G.custom = w.got; G.wiz = null; save(); play('yay'); }
  refreshPad(); renderSettings();
}

// ---------- one press ----------
function onPress(n) {
  const t = now();
  ensureAudio();
  if (n === 'minus' || G.screen === 'count' || (n === 'plus' && shown.minus)) return;
  if (G.screen === 'finale' && t < G.readyAt) return;
  if (!allowed().has(n)) { nope(n); return; } // a red X on the button he pressed
  switch (G.screen) {
    case 'title': if (n === 'plus') G.plusAt = t; else if (n === 'a') openHelp(); else startPaint(); break;
    case 'help': closeHelp(); break;
    case 'settings': settingsPress(n); break;
    case 'done': if (t > G.readyAt) startCountdown(); break;
    case 'finale': goTitle(); break;
    case 'paint':
      if (P.doneAt) { if (t > P.doneAt + 700) { play('go'); rumble(); G.gen++; newPicture(); } }
      else if (FACE.includes(n)) setColor(n);
      break;
    case 'play':
      if (DIAMOND.includes(G.kind)) facePress(n, t);
      else if (G.kind === 'combo') comboPress(n);
      else if (G.kind === 'doors') doorPress(n);
      else if (G.kind === 'pick') pickPress(n);
      else if (n === 'a' && t > G.busyUntil) { G.busyUntil = t + 700; play('beep'); rumble(0.15, 100); }
  }
}

// ---------- frame ----------
const shown = {};
let lastT = now();
function frame() {
  const t = now(), dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  const cur = readInput();
  if (padId !== shownPadId) { shownPadId = padId; applySkin(); renderSettings(); }
  if (G.wiz) wizFrame(cur);
  else for (const n of NAMES) if (cur[n] && !prev[n]) onPress(n);
  for (const n of NAMES) {
    if (!!cur[n] !== !!shown[n]) { shown[n] = !!cur[n]; const el = padEl(n); if (el && n !== 'lsm' && n !== 'rsm') el.classList.toggle('down', shown[n]); }
  }
  prev = cur;
  $('#k-ls .cap-move').setAttribute('transform', `translate(${(stick.lx * 7).toFixed(1)} ${(stick.ly * 7).toFixed(1)})`);
  $('#k-rs .cap-move').setAttribute('transform', `translate(${(stick.rx * 7).toFixed(1)} ${(stick.ry * 7).toFixed(1)})`);
  if (G.screen === 'play' && FIELD.includes(G.kind)) updateDrive(cur, dt, t);
  if (G.screen === 'play' && G.kind === 'hold') updateHold(cur, dt, t);
  updateNudge(t);
  if (G.plusAt) {
    if (cur.minus || G.screen !== 'title') G.plusAt = 0;
    else if (!cur.plus || t - G.plusAt > 250) { G.plusAt = 0; startGame(); }
  }
  if (G.wiz) { /* every button belongs to the teaching screen */ }
  else if (cur.minus && cur.plus && G.screen !== 'settings' && !G.minusLock) { G.plusAt = 0;
    G.bothHeld += dt; G.minusHeld = 0; showHome(G.bothHeld / HOME_SECONDS, '⚙');
    if (G.bothHeld >= HOME_SECONDS) { G.minusLock = true; G.bothHeld = 0; showHome(0); openSettings(); }
  } else if (cur.minus && !cur.plus && G.screen !== 'title' && G.screen !== 'settings' && !G.minusLock) {
    G.bothHeld = 0; G.minusHeld += dt; showHome(G.minusHeld / HOME_SECONDS);
    if (G.minusHeld >= HOME_SECONDS) { G.minusLock = true; G.minusHeld = 0; showHome(0); play('close'); goTitle(); }
  } else { if (!cur.minus) G.minusLock = false; if (G.minusHeld || G.bothHeld) { G.minusHeld = G.bothHeld = 0; showHome(0); } }
  if (G.screen === 'paint') updatePaint(cur, dt, t);
  if (diamond.classList.contains('hush') && t > G.hiddenUntil) diamond.classList.remove('hush');
  hud.textContent = G.note || '';
  const pn = padNotice(), np = $('#needpad'); if (np.textContent !== pn) { np.textContent = pn; np.hidden = !pn; }
  $('#needsound').hidden = soundOn();
  if (touchOn() !== touchShown) { touchShown = touchOn(); app.toggleAttribute('data-touch', touchShown); if (G.screen === 'paint') setTimeout(() => { if (G.screen === 'paint') newPicture(); }, 600); }
  requestAnimationFrame(frame);
}

// ---------- build the static bits ----------
$('#levels').innerHTML = KINDS.map(() => '<b></b>').join('') + '<span class="sticker cup">🏆</span>';
buildStars(); buildHits(); applySkin();
const LOGO = ['var(--blue)', 'var(--red)', 'var(--yellow)', 'var(--green)'];
$$('.logo [data-word]').forEach((line, w) => {
  line.innerHTML = [...line.dataset.word].map((ch, i) => `<i style="--lc:${LOGO[(i + w) % 4]};--r:${((i * 37 + w * 11) % 9) - 4}deg">${ch}</i>`).join('');
});
$('#confetti').innerHTML = Array.from({ length: 36 }, (_, i) =>
  `<i style="--x:${(i * 2.77 + (i % 5) * 3) % 100}%;--c:${Object.values(PAINT)[i % 4]};--d:${5 + (i % 5)}s;--w:${-(i * .37) % 6}s;--rot:${(i % 2 ? 1 : -1) * (200 + i * 20)}deg"></i>`).join('');
addEventListener('pointerdown', ensureAudio);
addEventListener('resize', () => { if (G.screen === 'paint') newPicture(); });
window.__showDone = () => showDone(); window.__game = { G, P, openSettings, onPress, startLevel, startPaint, showFinale, jumpTo };
goTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
