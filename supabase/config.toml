# Supabase CLI config. `project_id` is the local stack's container namespace,
# not the hosted project ref — `supabase link --project-ref <ref>` sets that.
project_id = "idea-capture"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

# Magic links are the only auth method. Everything below mirrors what has to be
# set in the hosted dashboard under Auth → URL Configuration; a mismatch there
# is the usual reason auth works locally and fails only in production.
[auth]
enabled = true
site_url = "http://localhost:5173/codex_experiments/"
additional_redirect_urls = [
  "http://localhost:5173/codex_experiments/",
  "https://vakalaktika.github.io/codex_experiments/",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.sms]
enable_signup = false

# Both functions verify the caller's JWT themselves (see functions/_shared/auth.ts)
# so they can return a JSON error shape the client understands rather than the
# gateway's bare 401.
[functions.generate-prompt]
verify_jwt = false

[functions.github-proxy]
verify_jwt = false
